
name: "Bug Report"
description: "Report unexpected application behavior"
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Describe the problem as clearly as possible.
        You do not need to identify the root cause.
        Technical investigation happens after issue intake.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What is going wrong?
      placeholder: Describe the issue in plain language.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens currently?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can the problem be recreated?
      placeholder: |
        1. Open the application
        2. Perform an action
        3. Observe the problem
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, OS, app version, or relevant setup.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Supporting Evidence
      description: Logs, screenshots, errors, or observations.
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: Known Constraints
      description: Existing behaviors that must be preserved.
    validations:
      required: false
